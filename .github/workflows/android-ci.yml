name: Android CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: ./apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk/app-debug.apk
          generate_release_notes: true
          body: |
            ## Eilaji ${{ github.ref_name }}

            ### Quick start — Backend (self-hosted, replaces Firebase)
            ```bash
            cd eilaji-backend
            docker-compose up -d          # postgres:5432  redis:6379  minio:9000/9001
            ./gradlew :backend:build
            ./gradlew :backend:run        # http://localhost:8080
            curl http://localhost:8080/health          # {"status":"UP"}
            curl http://localhost:8080/api/v1/medicines | head
            ```
            Default seeded users: `patient@eilaji.com` / `pharmacist1@eilaji.com` / `admin@eilaji.com`  password `password123`
            Categories: 6 / 12 subcategories / 36 medicines / 10 pharmacies (Damascus/Aleppo/Homs/Latakia/Hama)

            ### Android
            - Download `app-debug.apk` below (Assets)
            - `adb install -r app-debug.apk`  or drag into emulator
            - Emulator backend: `10.0.2.2:8080`  —  Physical device: `adb reverse tcp:8080 tcp:8080` → app uses `http://localhost:8080`
            - Guest can browse categories/medicines/pharmacies/nearby without signup. Prescriptions/orders/chat require login.

            ### Verify
            ```bash
            adb reverse tcp:8080 tcp:8080
            adb install -r app-debug.apk
            ```
            CI built from `${{ github.sha }}`.
