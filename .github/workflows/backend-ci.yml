name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eilaji_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x eilaji-backend/gradlew

      - name: Build
        working-directory: eilaji-backend
        env:
          APP_PROFILE: test
          CREATE_MISSING_TABLES: "true"
          DATABASE_URL: jdbc:postgresql://localhost:5432/eilaji_test
          DATABASE_USER: test
          DATABASE_PASSWORD: testpass
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-pipeline-only
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test
          MINIO_SECRET_KEY: testsecret
        run: ./gradlew :backend:build --stacktrace

      - name: Test
        working-directory: eilaji-backend
        env:
          APP_PROFILE: test
          CREATE_MISSING_TABLES: "true"
          DATABASE_URL: jdbc:postgresql://localhost:5432/eilaji_test
          DATABASE_USER: test
          DATABASE_PASSWORD: testpass
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-pipeline-only
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test
          MINIO_SECRET_KEY: testsecret
        run: ./gradlew :backend:test --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: eilaji-backend/backend/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
