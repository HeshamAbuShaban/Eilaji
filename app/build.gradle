plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs'
    // the recommended new way to use java annotation with kotlin better than (id 'kotlin-kapt')
    id 'com.google.devtools.ksp'
}

android {
    namespace 'dev.anonymous.eilaji'
    compileSdk 34

    // Keys are never committed: MAPS_API_KEY comes from local.properties or CI secrets.
    // See docs/SECURITY.md.
    def mapsApiKey = (project.findProperty("MAPS_API_KEY") ?: "").toString()
    def localPropertiesFile = rootProject.file("local.properties")
    if (mapsApiKey.isBlank() && localPropertiesFile.exists()) {
        def localProperties = new Properties()
        localPropertiesFile.withInputStream { localProperties.load(it) }
        mapsApiKey = localProperties.getProperty("MAPS_API_KEY", "")
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.1"
    }

    defaultConfig {
        applicationId "dev.anonymous.eilaji"
        // this was 21 and now in order to use the calender i upgraded it
        minSdk 23
        targetSdk 34 // ~upgrade to include the new android
        // Version identity. CI overrides both from the release tag, see .github/workflows/android-ci.yml
        versionCode (project.hasProperty("versionCode") ? project.property("versionCode").toString().toInteger() : 1)
        versionName (project.hasProperty("versionName") ? project.property("versionName") : "1.14.0")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        
        // Build config fields for sensitive data (replace with actual values in production)
    }


    // Release signing: read from keystore.properties (CI writes it, local dev may too).
    // The file is never committed; without it the release build stays unsigned.
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    def hasKeystore = keystorePropertiesFile.exists()
    if (hasKeystore) {
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = 17
    }


}


dependencies {
    // The Main SDK Library's To build any app
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // View Model && Live Data
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'

    // Navigation Component
    def nav_version = "2.7.0"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // sdp ssp
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'com.intuit.ssp:ssp-android:1.1.0'

    // Otp Pin View
    implementation 'io.github.chaosleung:pinview:1.4.4'

    // Splash API
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Networking - Retrofit, OkHttp, Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Security - EncryptedSharedPreferences + Biometric card-paywall
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.1.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Google Maps
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'


    // Glide for load image from internet
    implementation 'com.github.bumptech.glide:glide:4.15.1'

    // Rounded imageview
    implementation 'com.makeramen:roundedimageview:2.3.0'

    // room database
    var room_version = "2.5.2"
    implementation("androidx.room:room-runtime:$room_version")
    implementation("androidx.room:room-ktx:$room_version")
    ksp("androidx.room:room-compiler:$room_version")

    // Magic Indicator
    implementation 'com.github.hackware1993:MagicIndicator:1.7.0'

    // Worker Service aka The Reminder
    def work_version = "2.8.1"
    implementation "androidx.work:work-runtime-ktx:$work_version"

    // Pick Image in a recommend way
    def activity_version = "1.7.2"
    implementation "androidx.activity:activity-ktx:$activity_version"

    // Shimmer PlaceHolders for the Data that comes from the server
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Remarkable UI: Lottie motion moments + glass blur
    implementation 'com.airbnb.android:lottie:6.4.0'
    implementation 'com.github.Dimezis:BlurView:version-2.0.3'

    // Spring physics micro-interactions
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'

    // Compose islands (tracking sheet + checkout summary)
    def composeBom = platform('androidx.compose:compose-bom:2023.08.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime-livedata'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
// Note: release signing is optional. Without keystore.properties the release build is
// unsigned and cannot be installed; CI writes the file from the RELEASE_KEYSTORE_BASE64 secret.
