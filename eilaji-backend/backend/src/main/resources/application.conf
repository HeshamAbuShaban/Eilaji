# Eilaji backend configuration.
#
# Values here are development defaults. Every one of them can be overridden with an environment
# variable (AppConfig.kt lists the exact variable names); the JWT secret is never stored here.
#
# APP_PROFILE=dev (default): boot-time table creation + optional seeding, random dev JWT secret.
# APP_PROFILE=prod          : JWT_SECRET required, only named migrations, seeding refused.

server {
  port = 8080
  # Hard limits. Raise them only together with the storage/upload layer.
  maxUploadBytes = 8388608
  maxWebSocketFrameBytes = 1048576
  searchMaxRadiusKm = 50.0
}

app {
  profile = "dev"
}

database {
  url = "jdbc:postgresql://localhost:5432/eilaji_db"
  user = "eilaji"
  password = "eilaji_password_change_in_production"
  driver = org.postgresql.Driver
  poolSize = 10
  # Seeding is a development tool; production refuses to seed (APP_PROFILE=prod).
  seed-on-startup = false
  # Demo accounts with the known password "password123" are a development convenience:
  # they are the default for dev/test and refused in production, where every seeded
  # account gets a random password that is printed once.
  seed-demo-credentials = true
  # Boot-time table creation (SchemaUtils) - development convenience.
  createMissingTables = true
}

redis {
  url = "redis://localhost:6379"
}

minio {
  endpoint = "http://localhost:9000"
  accessKey = "eilaji_minio_admin"
  secretKey = "eilaji_minio_password"
  region = "us-east-1"
  buckets {
    prescriptions = prescriptions
    medicineImages = medicine-images
    pharmacyImages = pharmacy-images
    userAvatars = user-avatars
  }
}

jwt {
  # Intentionally absent: set JWT_SECRET in the environment.
  issuer = "eilaji-backend"
  audience = "eilaji-client"
  realm = "Eilaji API"
  expiresIn = 3600000
  refreshExpiresIn = 2592000000
}

security {
  passwordResetTokenTtlMinutes = 30
  bcryptCost = 12
}

rateLimit {
  perMinute = 100
  login {
    perMinute = 5
  }
  register {
    perHour = 3
  }
  refresh {
    perMinute = 10
  }
  # When Redis is unreachable, strict buckets (auth routes) reject requests instead of
  # silently disabling brute-force protection.
  failClosed = true
}

# Browser origins allowed to call the API with credentials, comma separated in CORS_ALLOWED_HOSTS.
cors {
  allowedHosts = []
}
